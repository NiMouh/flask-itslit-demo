<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #1f2a37;
      --panel: #fffaf2;
      --accent: #0f766e;
      --accent-2: #f97316;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, #ffe5cc 0%, transparent 35%),
        radial-gradient(circle at 90% 80%, #d9f6f1 0%, transparent 30%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
    }

    .card {
      width: min(720px, 100%);
      background: var(--panel);
      border: 2px solid #eadcc7;
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 16px 40px rgba(31, 42, 55, 0.12);
    }

    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      line-height: 1.2;
    }

    p { margin: .5rem 0; }

    .meta {
      font-size: 0.92rem;
      opacity: .8;
    }

    button {
      margin-top: 1rem;
      border: 0;
      border-radius: 10px;
      padding: .7rem 1rem;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    #quote {
      margin-top: 1rem;
      padding: .85rem;
      border-left: 4px solid var(--accent);
      background: #fff;
      border-radius: 8px;
      min-height: 3rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>{{ app_name }}</h1>
    <p>Rendered at: <strong>{{ now }}</strong></p>
    <p class="meta">This app logs colorful terminal messages via itslitlib.</p>
    <pre>{{ banner }}</pre>

    <button id="loadQuote" type="button">Load Quote</button>
    <section id="quote">Press the button to fetch a quote from the Flask API.</section>
  </main>

  <script>
    const button = document.getElementById("loadQuote");
    const quoteBox = document.getElementById("quote");

    button.addEventListener("click", async () => {
      quoteBox.textContent = "Loading...";
      try {
        const response = await fetch("/api/quote");
        const payload = await response.json();
        if (!response.ok) {
          quoteBox.textContent = payload.error || "Request failed.";
          return;
        }
        quoteBox.textContent = `"${payload.content}" - ${payload.author}`;
      } catch (err) {
        quoteBox.textContent = "Network error while loading quote.";
      }
    });
  </script>
</body>
</html>
